<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daraz</title>
    <link rel="stylesheet" href="./styles/shared/header.css" />
    <link rel="stylesheet" href="./styles/shared/general.css" />
    <link rel = "stylesheet" href = "./styles/pages/product.css"
      <!-- Load a font called Roboto from Google Fonts. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
      />

  </head>
  <body>
    <div class="header">
      <div class="left-section">
        <img class="daraz-logo" src="./images/darazLogo.png" alt="daraz-Logo" />
      </div>
      <div class="middle-section">
        <input class="search-bar" type="text" placeholder="search" />
        <button class="search-button">
          <img
            class="search-icon"
            src="images/icons/search-icon.png"
            alt="search-icon"
          />
        </button>
      </div>
      <div class="right-section">
        <a class="orders-link header-link" href="orders.html">
          <span class="returns-text">Returns</span>
          <span class="orders-text">& Orders</span>
        </a>
        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png" alt="cart-logo" />
          <div class="cart-quantity">3</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </div>

    <div class="products-box">

   <!-- Product Grid -->
    <div class="main">
      <div class="product-grid js-products-grid">
      
     </div>
</div>

   </div>
   <script src="data/cart.js"></script>
   <script src="data/products.js"></script>
     <script src="script/daraz.js"></script>
  </body>
</html>
