<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Page</title>
  <link rel="stylesheet" href="styles/shared/header.css">
  <link rel="stylesheet" href="styles/pages/tracking.css">
   <!-- Load a font called Roboto from Google Fonts. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
</head>
<body>

   <!--This is header section HTML-->
    <div class="header">
      <div class="left-section">
        <img class="daraz-logo" src="./images/darazLogo.png" alt="daraz-Logo" />
      </div>
      <div class="middle-section">
        <input class="search-bar" type="text" placeholder="search" />
        <button class="search-button">
          <img
            class="search-icon"
            src="./images/search-icon.png"
            alt="search-icon"
          />
        </button>
      </div>
      <div class="right-section">
        <a class="orders-link header-link" href="orders.html">
          <span class="returns-text">Returns</span>
          <span class="orders-text">& Orders</span>
        </a>
        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="./images/cart-icon.png" alt="cart-logo" />
          <div class="cart-quantity">3</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </div>

    <!--This is Tracking Html-->

    <div class="main-tracking">
      <div class="tracking-container">
        <div class="title-tracking">
           <a href="orders.html">
                  View all orders
              </a>      
        </div>
        
        <div class="arrival">
          Arriving on Friday, September 11
        </div>
        <div class="product-name">Adults Plain Cotton T-Shirt - 2 Pack</div>
        <div class="quantity"> Quantity: 1074</div>
        <div class="tracking-image-container">
          <img class="tracking-image" src="images/adults-plain-cotton-tshirt-2-pack-teal.jpg" alt="tshirt">
        </div>
        <div class="progress-heading">
          <div class="preparing">Preparing</div>
             <div class="Shipped">Shipped</div>
                <div class="delivered">Delivered</div>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar"></div>

        </div>



      </div>

    </div>

  
</body>
</html>
